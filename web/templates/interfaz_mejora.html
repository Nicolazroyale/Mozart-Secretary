<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interfaz Mejorada · Gestión Escolar</title>
    <link rel="stylesheet" href="../css/mejoras.css?v=3">
    <link rel="icon" href="../imagenes/logo.png?v=1" type="image/png">
</head>
<body>
    <div id="app-mejoras" data-nombre="{{.Nombre}}" data-rol="{{.Rol}}"></div>
    <script type="module">
        import { initInterfazMejora } from '../js/Interfaz_mejora.js';
        const app = document.getElementById('app-mejoras');
        if (app) {
            initInterfazMejora(app, {
                user: { nombre: app.dataset.nombre || 'Administrador', rol: app.dataset.rol || '' }
            });
        }
    </script>
</body>
</html>
