<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{.CSRF}}">
    <title>Sistema · Gestión Escolar</title>
    <script>try { if (localStorage.getItem('mozart-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
    <link rel="stylesheet" href="/css/app.css?v=19">
    <link rel="stylesheet" href="/css/crud.css?v=11">
    <link rel="icon" href="/imagenes/logo.png?v=1" type="image/png">
</head>
<body>
    <div id="app"
         data-nombre="{{.Nombre}}"
         data-rol="{{.Rol}}"
         data-csrf="{{.CSRF}}"
         data-esadmin="{{.EsAdmin}}"
         data-permisos="{{.Permisos}}"
         data-ultimo-backup="{{.UltimoBackup}}"></div>
    <script type="module">
        import { initMain } from '/js/main.js?v=34';
        const app = document.getElementById('app');
        if (app) {
            initMain(app, {
                user: {
                    nombre: app.dataset.nombre || 'Administrador',
                    rol: app.dataset.rol || ''
                },
                csrf: app.dataset.csrf || '',
                esAdmin: app.dataset.esadmin === 'true',
                permisos: JSON.parse(app.dataset.permisos || '[]'),
                ultimoBackup: app.dataset.ultimoBackup || ''
            });
        }
    </script>
</body>
</html>
