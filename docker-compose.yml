services:
  web:
    build: .
    container_name: web_mozart
    ports:
      - "8080:80"
    volumes:
      - ./apache2:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-escuela_secundaria_tecnica}
      DB_USER: ${DB_USER:-DBsecretaria}
      DB_PASS: ${DB_PASS:-Dalia1244!}
    networks:
      - red_mozart

  db:
    image: mariadb:10.11
    container_name: db_mozart
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-schuldatenbank123456}
      MYSQL_DATABASE: ${DB_NAME:-escuela_secundaria_tecnica}
      MYSQL_USER: ${DB_USER:-DBsecretaria}
      MYSQL_PASSWORD: ${DB_PASS:-Dalia1244!}
    volumes:
      - ./mariadb:/var/lib/mysql #Aca se guarda toda la DB
      - ./inicializar_bd:/docker-entrypoint-initdb.d #Aca va el .sql para que levante la DB
    networks:
      - red_mozart

networks:
  red_mozart:





