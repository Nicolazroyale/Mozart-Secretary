services:
  web:
    build: .
    container_name: web_schuldatenbank
    ports:
      - "8080:80"
    volumes:
      - ./apache2:/var/www/html
    networks:
      - red_schuldatenbank

  db:
    image: mysql:8.0.32
    container_name: db_schuldatenbank
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: schuldatenbank123456
      MYSQL_DATABASE: escuela_secundaria_tecnica     # Nombre de la DB
      MYSQL_USER: DBsecretaria                        # Usuario nuevo con permisos
      MYSQL_PASSWORD: Dalia1244!                      # Contraseña del usuario nuevo

    volumes:
      - ./mysql:/var/lib/mysql #Aca se guarda toda la DB
      - ./inicializar_bd:/docker-entrypoint-initdb.d #Aca va el .sql para que levante la DB
    networks:
      - red_schuldatenbank

networks:
  red_schuldatenbank:
