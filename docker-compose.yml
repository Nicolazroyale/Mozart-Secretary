services:
  mozart:
    build: .
    image: mozart:latest
    container_name: mozart
    ports:
      - "443:443"
      - "127.0.0.1:8081:8081"
      - "[::1]:8081:8081"
    environment:
      - PORT=443
      - HTTP_PORT=8081
      - DATA_DIR=/data
      - DB_PATH=/data/mozart.db
      - WEB_ROOT=/srv/web
      - TEMPLATES_DIR=/srv/templates
      - HOSTNAME=${HOSTNAME:-}
      - MASTER_PASSWORD=${MASTER_PASSWORD:-}
      - ADMIN_USER=${ADMIN_USER:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - DB_KEY=${DB_KEY:-}
      - BACKUP_DIR=${BACKUP_DIR:-/data/backups}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_KEEP_MONTHS=${BACKUP_KEEP_MONTHS:-12}
    volumes:
      - ./data:/data
      # Bind mounts para desarrollo: editar web/ y templates/ sin rebuild.
      - ./web:/srv/web
      - ./web/templates:/srv/templates
    restart: unless-stopped